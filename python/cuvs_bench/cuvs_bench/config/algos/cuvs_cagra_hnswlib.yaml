name: cuvs_cagra_hnswlib
constraints:
  build: cuvs_bench.config.algos.constraints.cuvs_cagra_build
  search: cuvs_bench.config.algos.constraints.hnswlib_search
groups:
  base:
    build:
      graph_degree: [32, 64, 96, 128]
      intermediate_graph_degree: [32, 64, 96, 128]
      graph_build_algo: ["IVF_PQ"]
      # ivf_pq_build_nlist: [5000]
      # ivf_pq_build_pq_dim: [128]
      # ivf_pq_build_pq_bits: [8]
      # ivf_pq_build_nlist: [5000]
      # ivf_pq_build_ratio: [10]
      # ivf_pq_search_nprobe: [2]
      # ivf_pq_search_internalDistanceDtype: ["half"]
      # ivf_pq_search_smemLutDtype: ["half"]
      hierarchy: ["cpu"]
      ef_construction: [64, 128, 256, 512]
    search:
      ef: [10, 20, 40, 60, 80, 120, 200, 400, 600, 800]
  test:
    build:
      graph_degree: [32]
      intermediate_graph_degree: [32]
      graph_build_algo: ["NN_DESCENT"]
      hierarchy: ["none", "cpu"]
      ef_construction: [64]
    search:
      ef: [10,20]
